media:
  input: src/images
  output: /src/images
  extensions: [webp]

content:
  - name: works
    label: Works
    type: collection
    path: src/content/works
    filename: "{slug}.md"

    commit:
      templates:
        create: "feat(works): add project entry - {filename}"
        update: "refactor(works): update project details - {filename}"
        delete: "refactor(works): remove project entry - {filename}"
        rename: "refactor(works): rename project file - {oldFilename} -> {newFilename}"

    view:
      primary: title
      fields: [title, year, category, featured]
      sort: [year, title]
      default:
        sort: year
        order: desc

    fields:
      - name: title
        label: Project Title
        type: string
        required: true
        description: "Enter the project name as it should appear on the website."

      - name: slug
        label: Project Slug
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: "Use lowercase letters, numbers, and hyphens only."
        description: "Used in the project URL. Avoid changing it after publication."


      - name: year
        label: Year Completed
        type: number
        required: true
        options:
          min: 1900
          max: 2100
        description: "Enter the year the project was completed."

      - name: category
        label: Project Category
        type: select
        required: true
        options:
          values: [Residential, Commercial]
        description: "Choose the category that best describes this project."

      - name: description
        label: Project Description
        type: text
        required: true
        description: "Write a concise/short summary of the project."

      - name: coverImage
        label: Cover Image
        type: image
        required: true
        options:
          unique: true
          extensions: [webp]
        description: "Choose the main image displayed for this project."

      - name: images
        label: Image Gallery
        type: image
        required: true
        options:
          multiple:
            max: 20
            unique: true
            extensions: [webp]
        description: "Add up to 20 project images. Arrange them in the order you want them displayed."

      - name: featured
        label: Featured Project
        type: boolean
        description: "Enable this if the project should appear in the featured works section."

settings:
  commit:
    templates:
      create: "feat(content): create {path}"
      update: "refactor: update {path}"
      delete: "refactor: delete {path}"
      rename: "refactor: rename {oldPath} -> {newPath}"

actions:
  - name: publish-site
    label: Publish changes
    workflow: pages-cms-publish.yml
    ref: current
    confirm:
      title: Publish changes?
      message: This will publish the current CMS changes to the live website.
      button: Publish