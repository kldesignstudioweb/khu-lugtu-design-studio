media:
  input: src/images
  output: /src/images

content:
  - name: works
    label: Works
    type: collection
    path: src/content/works
    filename: "{slug}.md"

    commit:
      templates:
        create: "feat(works): add project entry - {filename}"
        update: "content(works): update project details - {filename}"
        delete: "content(works): remove project entry - {filename}"
        rename: "refactor(works): rename project file - {oldFilename} -> {newFilename}"

    view:
      primary: title
      fields: [title, year, category, featured]
      sort: [year, title]
      default:
        sort: year
        order: desc

    fields:
      - name: title
        label: Project Title
        type: string
        required: true

      - name: slug
        label: Project Slug
        type: string
        required: true

      - name: year
        label: Year Completed
        type: number
        required: true
        options:
          min: 1900
          max: 2100

      - name: category
        label: Project Category
        type: select
        required: true
        options:
          values: [Residential, Commercial]

      - name: description
        label: Project Description
        type: text
        required: true

      - name: coverImage
        label: Cover Image
        type: image
        required: true

      - name: images
        label: Image Gallery
        type: image
        required: true
        options:
          multiple:
            max: 10
            unique: true
            extensions: [webp]

      - name: featured
        label: Featured Project
        type: boolean

settings:
  commit:
    templates:
      create: "feat(content): create {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
      rename: "content: rename {oldPath} -> {newPath}"