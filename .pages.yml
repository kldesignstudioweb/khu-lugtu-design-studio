media:
  input: src/images
  output: /images

content:
  - name: Works
    type: collection
    path: src/content/works

    fields:
      - name: title
        label: Project Title
        type: string
        required: true

      - name: slug
        label: Project Slug
        type: string
        required: true

      - name: year
        label: Year Completed
        type: number
        required: true
        options:
          min: 1900
          max: 2100

      - name: category
        label: Project Category
        type: select
        required: true
        options:
          values: [Residential, Commercial]

      - name: description
        label: Project Description
        type: text
        required: true

      - name: cover
        label: Cover Image
        type: image
        required: true

      - name: images
        label: Image Gallery
        type: image
        required: true
        options:
          multiple:
            max: 10
            unique: true
            extensions: [webp]
            rename: true

      - name: featured
        label: Featured Project
        type: boolean
        